name: Optional C++ and recorded-data comparisons

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    name: Recorded presentations and Page comparison
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dimpase/ArithmeticVoronoiData.jl
          ref: 5c7152689d28be0a6ecf46ecddb4f5a5c3e36eaa
          path: recorded-data
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.2'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install Julia dependencies
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false)'
      - name: Verify recorded matrices, relations and abelianizations
        run: |
          julia --startup-file=no --project=. test/imaginary_bundle.jl recorded-data/data/imaginary_presentations.json
          julia --startup-file=no --project=. test/page_comparison.jl recorded-data/data/page_presentations.json recorded-data/data/imaginary_presentations.json

  cpp:
    name: C++ and archived fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check out recorded-data archives
        uses: actions/checkout@v7
        with:
          repository: dimpase/ArithmeticVoronoiData.jl
          ref: 5c7152689d28be0a6ecf46ecddb4f5a5c3e36eaa
          path: recorded-data
          lfs: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgmp-dev libeigen3-dev libboost-serialization-dev libnauty-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkgconf gmp eigen@3 boost nauty
          echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen@3):$(brew --prefix)" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.2'
      - name: Install Julia dependencies and fixtures
        run: |
          julia --startup-file=no --project=integrations/perfect_forms -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false)'
          python3 scripts/restore_fixtures.py --data-root recorded-data
          echo "PERFECT_FORMS_SOURCE=$(julia --startup-file=no --project=integrations/perfect_forms -e 'using PerfectForms; print(pkgdir(PerfectForms))')" >> "$GITHUB_ENV"
          echo "PERFECT_FORMS_BACKEND_CONFIG=$PWD/backend-install/config.json" >> "$GITHUB_ENV"
      - name: Configure backend package
        run: >-
          cmake -S "$PERFECT_FORMS_SOURCE" -B build/perfect-forms -G Ninja
          -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG'
          -DCMAKE_INSTALL_PREFIX="$PWD/backend-install"
      - name: Build
        run: cmake --build build/perfect-forms --parallel 1
      - name: Native tests
        run: ctest --test-dir build/perfect-forms --output-on-failure
      - name: Install
        run: cmake --install build/perfect-forms
      - name: Historical C++ integration tests
        run: julia --startup-file=no --project=integrations/perfect_forms test/cpp.jl
